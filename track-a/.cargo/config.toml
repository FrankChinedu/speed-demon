# AVX2/BMI2/FMA for the scoring box (i5-13500, no AVX-512). Scoped to the x86-64
# target so local arm64 Docker builds ignore it. Deliberately not target-cpu=native:
# native forces the board to build on the scoring box, and x86-64-v3 runs on any
# build machine (matters for PGO training runs).
[target.x86_64-unknown-linux-gnu]
# Profile-guided optimisation: pgo.profdata is the merged profile of an instrumented
# build of this code run on full seeds 2 and 3 (never seed 1, the board's data). It
# only steers code layout, inlining and branch order; it cannot change any result.
rustflags = ["-C", "target-cpu=x86-64-v3", "-C", "profile-use=pgo.profdata"]
