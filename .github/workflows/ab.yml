# A/B timing of two commits of one track on an x86-64 runner (AVX2 paths run, as on
# the scoring box). The board builds only the track-* folders of the speed-demon
# branch, so this never affects a score or takes a board slot.
#
# Start it either way:
#   gh workflow run ab.yml -f track=c -f base=<sha> -f head=<sha>
#   or push a branch ab/<anything> whose commit has dev/ab.json:
#   {"track": "c", "base": "<sha>", "head": "<sha>", "runs": 15}
name: ab
on:
  push:
    branches: ["ab/**"]
  workflow_dispatch:
    inputs:
      track:
        description: "track (a, b, c or d)"
        required: true
        default: "a"
      base:
        description: "baseline commit"
        required: true
      head:
        description: "candidate commit"
        required: true
      runs:
        description: "timed runs of each, alternating"
        required: false
        default: "15"
jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Write access only to commit the result back to the ab/ branch that started it.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026 /tmp/harness
      - env:
          TRACK: ${{ inputs.track }}
          BASE: ${{ inputs.base }}
          HEAD_REF: ${{ inputs.head }}
          RUNS: ${{ inputs.runs }}
        run: |
          if [ -z "$TRACK" ]; then
            TRACK=$(python3 -c 'import json;print(json.load(open("dev/ab.json"))["track"])')
            BASE=$(python3 -c 'import json;print(json.load(open("dev/ab.json"))["base"])')
            HEAD_REF=$(python3 -c 'import json;print(json.load(open("dev/ab.json"))["head"])')
            RUNS=$(python3 -c 'import json;print(json.load(open("dev/ab.json")).get("runs", 15))')
          fi
          python3 dev/tools/ab.py "$TRACK" "$BASE" "$HEAD_REF" "$RUNS" 2>&1 | tee /tmp/ab.log
      # On an ab/ branch push, the result is committed back to that branch, so it can
      # be read with a plain git fetch.
      - if: always() && github.event_name == 'push'
        run: |
          git worktree prune
          tail -n 12 /tmp/ab.log > dev/ab-result.txt
          git config user.name "ab-workflow"
          git config user.email "ab-workflow@users.noreply.github.com"
          git add dev/ab-result.txt
          git commit -q -m "ab result"
          git push origin HEAD:${{ github.ref }}
