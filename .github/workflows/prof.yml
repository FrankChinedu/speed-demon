# Profile one track on an x86-64 runner: perf stat (hardware counters when the VM
# exposes them) and a cpu-clock profile by source line. Push a branch prof/<anything>
# whose commit has dev/prof.json: {"track": "a"}. Never affects a score.
name: prof
on:
  push:
    branches: ["prof/**"]
jobs:
  prof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update -q && sudo apt-get install -y -q linux-tools-common linux-tools-$(uname -r) binutils >/dev/null || sudo apt-get install -y -q linux-tools-generic binutils >/dev/null
      - run: git clone --depth 1 https://github.com/hackathon-raptors/speed-demon-2026 /tmp/harness
      - run: |
          T=$(python3 -c 'import json;print(json.load(open("dev/prof.json"))["track"])')
          G=$(python3 -c "print({'a':'a_ingest.py','c':'c_join.py'}['$T'])")
          python3 /tmp/harness/generators/$G --seed 1 --scale full --out /tmp/data
          cat /tmp/data/* > /dev/null
          cd track-$T && CARGO_PROFILE_RELEASE_DEBUG=line-tables-only cargo build --release -q && cd ..
          B=track-$T/target/release/solution; mkdir -p /tmp/out
          sudo sysctl -q kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0 || true
          $B /tmp/data /tmp/out
          PERF=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -1); PERF=${PERF:-perf}
          for i in 1 2 3; do $PERF stat -e task-clock,cycles,instructions,branches,branch-misses,cache-misses,page-faults $B /tmp/data /tmp/out 2>&1 | tail -14; done
          $PERF record -q -e cpu-clock -F 20000 -o /tmp/p.data -- $B /tmp/data /tmp/out
          $PERF report -i /tmp/p.data --stdio --no-children --sort sym 2>/dev/null | grep -v '^#' | grep -v '^$' | head -25
          $PERF report -i /tmp/p.data --stdio --no-children --sort srcline 2>/dev/null | grep -v '^#' | grep -v '^$' | head -45 > /tmp/hot
          while read pct loc rest; do f=${loc%:*}; l=${loc##*:}; case $f in *track-$T/src/*) printf "%s %s: %s\n" "$pct" "${f##*/}:$l" "$(sed -n "${l}p" track-$T/src/${f##*/src/} | cut -c1-100)";; *) echo "$pct $loc";; esac; done < /tmp/hot
